---
# backup: restic + nightly cron job targeting external S3.
# Secrets (repo URL, keys, restic password) must come from Infisical at
# runtime. The role is a no-op for the env file until they are set, so a
# test VM without real secrets still bootstraps cleanly.

- name: Install restic and cron
  ansible.builtin.apt:
    name:
      - restic
      - cron
    state: present

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_install_path }}"
    state: directory
    owner: "{{ backup_scripts_owner }}"
    group: "{{ backup_scripts_group }}"
    mode: "0750"

- name: Deploy restic environment file
  ansible.builtin.template:
    src: restic.env.j2
    dest: "{{ backup_install_path }}/restic.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Deploy backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ backup_install_path }}/backup.sh"
    owner: "{{ backup_scripts_owner }}"
    group: "{{ backup_scripts_group }}"
    mode: "{{ backup_scripts_mode }}"

- name: Deploy nightly backup cron job
  ansible.builtin.cron:
    name: restic-backup
    hour: "{{ backup_cron_hour }}"
    minute: "{{ backup_cron_minute }}"
    job: "{{ backup_install_path }}/backup.sh >> /var/log/backup.log 2>&1"
    state: "{{ 'present' if backup_restic_repo else 'absent' }}"
