---
# Minimal monitoring: node_exporter metrics endpoint. Scraping/alerting
# (Prometheus, Grafana, etc.) is added at a later stage, not here.

monitoring_node_exporter_version: "1.8.2"
monitoring_node_exporter_listen_addr: "0.0.0.0:9100"
monitoring_node_exporter_release_base: "https://github.com/prometheus/node_exporter/releases/download"
monitoring_node_exporter_archive: "node_exporter-{{ monitoring_node_exporter_version }}.linux-amd64"
